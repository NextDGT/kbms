name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall rebuilds better-sqlite3 for Electron
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Dictionary smoke test
        run: npm run smoke

      # Runs inside Electron with --ozone-platform=headless; no display needed
      - name: Tests
        run: npm test
